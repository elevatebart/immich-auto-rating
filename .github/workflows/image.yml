name: image

on:
  push:
    branches: [main]
    tags: ['v*']
    # Docs and the probe script change nothing about the image.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      version:
        description: Version to tag, e.g. 0.2.0. Leave empty to publish latest only.
        required: false
        type: string

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A tag publishes its version alongside latest; a push to main only moves latest.
      # Plain ifs, not `[ x ] && y`: the runner's bash is -e and a false test would fail the step.
      - id: tags
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then
            case "${{ github.ref }}" in
              refs/tags/v*) version="${GITHUB_REF#refs/tags/v}" ;;
            esac
          fi
          {
            echo "list<<EOT"
            echo "ghcr.io/${{ github.repository }}:latest"
            if [ -n "$version" ]; then
              echo "ghcr.io/${{ github.repository }}:$version"
            fi
            echo "EOT"
            echo "version=${version:-latest}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
