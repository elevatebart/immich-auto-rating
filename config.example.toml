# immich-auto-rating configuration.
# No secrets here: IMMICH_API_KEY, PGPASSWORD and the rest come from the environment.

[household]
# Immich person names, or ids if two people share a name. Resolved once per run against
# GET /people. Matching is case insensitive but NOT accent insensitive, so these must be spelled
# exactly as Immich holds them: "Thais" will not find "Thaïs". Anything that fails to resolve is
# logged as household.unmatched rather than failing the run, so check the first run's log.
persons = ["Firstname Lastname", "Other Person"]

[prompts]
# Zero-shot text prompts, used until the state DB holds ridge.min_labels frozen labels.
# Scoring is a softmax over positive and negative together, so the two lists compete.
#
# Negatives must name a SUBJECT, not a quality. CLIP answers "is this a receipt" well and
# "is this blurry" badly. "a blurry accidental photo" was 1,010 firings on a real 18,000 asset
# library, 44% of all negative hits, and it was catching ordinary soft or dim photographs. A
# genuinely blurry photo already ranks low on the positive prompts, so it needs no hard floor.
positive = [
  "a photo of a family together",
  "a portrait of a person, sharp and well lit",
  "a beautiful landscape photograph",
  "a candid moment between people",
  "a well composed travel photograph",
]
negative = [
  "a screenshot of a phone screen",
  "a screenshot of a computer application",
  "a photo of a paper receipt",
  "a scan of a document or a form",
  "a photo of a computer screen showing text",
  "a photo of a parking sign or a label",
]

[pool]
# EMPTY ON PURPOSE: no album is created or touched. The rating itself is the output, and anything
# that wants the pool asks the API for it, which needs no album and is always current:
#
#   POST /api/search/metadata
#   {"filter": {"rating": {"gte": 5}, "type": {"eq": "IMAGE"},
#               "visibility": {"eq": "timeline"}, "trashedAt": {"eq": null}}, "size": 1000}
#
# Set a name here only when something needs a real album object: an Immich slideshow, a photo frame
# app that takes an album id, or a share link. Doing so also needs album.create, albumAsset.create
# and albumAsset.delete on the API key, which are otherwise unnecessary.
album = ""
# 5 rather than 4. Ratings here are ranks, so a 4 means "top quarter", not "good": at min_rating 4
# the pool took 39% of the library on a real run.
min_rating = 5

[exif]
# EMPTY ON PURPOSE, which switches the ratio rule off. A ratio only ever counted alongside a
# missing EXIF camera make, and that pair turns out to describe old camera photos, not screenshots:
# on a real library it fired on 521 assets and a hand review put it at 3 correct in 8, so it was
# demoting roughly 330 photographs. The sampled misfires were all image/jpeg named IMG_0519.JPG,
# PICT0028.jpg and the like, at 4032x3024 and 1600x900, so there is no file type left to gate on.
# Screenshots are caught by filename_patterns and by the two screenshot prompts instead.
# Exact screen resolutions (1170x2532 and friends) would be precise where a ratio is not, if this
# ever needs to come back.
screenshot_ratios = []
ratio_tolerance = 0.012
# Case insensitive substrings tested against the original file name.
filename_patterns = ["screenshot", "screen shot", "capture", "scan_", "img_scan", "receipt", "facture"]

[albums]
# Optional. Album names matching any of these substrings mark their assets as trip photos.
trip_patterns = ["trip", "voyage", "holiday", "vacances"]

[ridge]
lambda = 1.0
min_labels = 150
# Folds for the k-fold MAE that refit prints. Ignored when labels are fewer than folds.
folds = 5

[zeroshot]
# A negative prompt has to beat every positive one by this much softmax mass to force a 1.
negative_margin = 0.15
# Cut points over the run's rank, low to high, giving the 1..5 buckets. These say 15% of the
# library is 1 star, 25% is 2, 50% is 3, 7.5% is 4, 2.5% is 5.
#
# Ratings are RELATIVE. The bottom 15% gets 1 star whether or not anything in it is bad, and the
# pool size is decided here, not by how many good photos you have.
#
# The top two cuts have to move together. The household bump promotes a share of the 4 star bucket
# into 5, so a wider 4 star bucket feeds a bigger 5 star one:
#   5 star share = (1 - cut4) + household_face_rate * (cut4 - cut3)
# At a measured 39% household face rate, [.., 0.7, 0.9] gives 18% and [.., 0.90, 0.975] gives 5.4%.
# Re-run `report` after changing these: it prints the count per rating and the resulting pool size.
quantiles = [0.15, 0.4, 0.90, 0.975]

[ml]
# Leave empty to read machineLearning.clip.modelName from GET /api/admin/config.
# Set it when the API key is not allowed adminConfig.read.
model_name = ""

[write]
# Assets per bulk PUT /api/assets call, and how many of those run at once.
batch_size = 250
concurrency = 4
max_retries = 5
