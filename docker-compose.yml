# Everything lives under /volume1/docker/immich-auto-rating: this file, .env, config.toml and the
# state DB. That share is chosen, not incidental: /volume1/tools is an ACL-only share where the
# POSIX mode is 000 and only the administrators group is granted, so a non-root container cannot
# read it at all. Nothing runs permanently, DSM Task Scheduler calls it once a month. See README.md.
#
# Paths are absolute and the secrets come from env_file, so `docker compose` behaves the same
# whatever directory the task happens to run from.
services:
  rate:
    image: ghcr.io/elevatebart/immich-auto-rating:latest
    # build: .   # uncomment to build on the NAS instead of pulling
    container_name: immich-auto-rating
    env_file:
      - /volume1/docker/immich-auto-rating/.env
    environment:
      STATE_DIR: /data/state
      CONFIG: /data/config.toml
    volumes:
      # Holds config.toml and state/state.sqlite. The SQLite file is the memory of the whole thing:
      # back it up, losing it means every hand correction is forgotten.
      - /volume1/docker/immich-auto-rating/data:/data
    networks:
      - immich
    command: ["apply"]

networks:
  # Immich's own compose network. Confirmed 2026-09-17: the stack is the `immich-photos` project,
  # so this is `immich-photos_default`, not the `immich_default` that also exists on this host.
  immich:
    external: true
    name: immich-photos_default
